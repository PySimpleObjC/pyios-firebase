# Publish pyios-firebase to PyPI.
#
#   1. Set __version__ in src/pyios_firebase/__init__.py, merge to main.
#   2. Push a tag: git tag v0.2.0 && git push origin v0.2.0
#      or, on GitHub: Releases > Draft a new release > a new tag v0.2.0 on
#      main > Publish release (publishing creates the tag)
#
# The tag runs the checks, builds the sdist and the wheel, checks that the tag
# matches __version__, publishes to PyPI, and attaches the files to the GitHub
# Release (made here for a pushed tag; the one you published for the other way).
#
# "Run workflow" (manual) publishes to TestPyPI instead, as a dry run.
#
# No API token: PyPI trusts this workflow directly (Trusted Publishing). One-
# time setup on pypi.org (and test.pypi.org for the dry run): Your projects ->
# Publishing -> add a GitHub publisher: owner PySimpleObjC, repository
# pyios-firebase, workflow release.yml, environment pypi (testpypi).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: The tag must match __version__
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/pyios_firebase/__init__.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match __version__ $version"
            exit 1
          fi
      - name: Build
        run: uv build
      - name: Check the metadata (what PyPI shows)
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pyios-firebase/
    permissions:
      id-token: write   # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-test:
    name: Publish to TestPyPI (dry run)
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/pyios-firebase/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  github-release:
    name: GitHub Release (files attached)
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the release, or add the files to it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a release published on GitHub made the tag: attach the files to it
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "pyios-firebase ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi
