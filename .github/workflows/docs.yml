# The documentation website, on GitHub Pages:
# https://pysimpleobjc.github.io/pyios-firebase/
#
# Pull requests: build it (strict: a broken link or anchor fails).
# Pushes to main: build it and publish it.
# The repository needs Settings > Pages > Source: "GitHub Actions".

name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "README.md", "mkdocs.yml", "src/**", "pyproject.toml", "uv.lock", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "README.md", "mkdocs.yml", "src/**", "pyproject.toml", "uv.lock", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Build the site
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: uv run --only-group docs mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
