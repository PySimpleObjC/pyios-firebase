[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyios-firebase"
dynamic = ["version"]
description = "Pure-Python Firebase for iOS apps (Kivy, BeeWare, ...), built on Rubicon-ObjC"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Kenechukwu Akubue", email = "kengoon19@gmail.com" },
]
keywords = [
    "iOS",
    "Firebase",
    "Firestore",
    "rubicon-objc",
    "Kivy",
    "BeeWare",
]
requires-python = ">=3.11"
dependencies = [
    "rubicon-objc>=0.5.2",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: iOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[tool.setuptools.dynamic]
version = { attr = "pyios_firebase.__version__" }

[tool.setuptools.package-data]
# PEP 561: tells type checkers this package ships its own type hints
pyios_firebase = ["py.typed"]

[project.urls]
Homepage = "https://github.com/PySimpleObjC/pyios-firebase"
Issues = "https://github.com/PySimpleObjC/pyios-firebase/issues"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.13", "pyright>=1.1.390"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
# tests/typing checks the public API the way an app sees it
files = ["src", "tests/typing"]
# the 0.1 App Check / Auth modules, untyped until they move to subpackages
exclude = ['src/pyios_firebase/(firappcheck|firuser|firgoogleauth)\.py$']

[[tool.mypy.overrides]]
# Rubicon has no type information: its objects are Any to the checkers
module = ["rubicon", "rubicon.*"]
ignore_missing_imports = true

[tool.pyright]
include = ["src"]
exclude = [
    "src/pyios_firebase/firappcheck.py",
    "src/pyios_firebase/firuser.py",
    "src/pyios_firebase/firgoogleauth.py",
]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"
