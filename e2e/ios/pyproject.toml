# The end-to-end test app: runs pyios-firebase against the Firebase emulators
# in the iOS Simulator. Run it with ../run_ios_e2e.sh, not directly.

[project]
name = "pyios-firebase-e2e"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "kivy",
    "rubicon-objc>=0.5.7",
    # the wheel built from this checkout by run_ios_e2e.sh (wheels/)
    "pyios-firebase==0.3.0",
]

[tool.kivy]
display_name = "pyios e2e"
app_dir = "src"
entry_point = "main"
orientation = ["portrait"]

[tool.kivy.ios]
schema_version = 1
bundle_id = "io.github.pysimpleobjc.pyiosfirebase.e2e"
build = 1
deployment_target = "15.0"
find_links = ["wheels"]
extra_index_urls = ["https://elliotgarbus.github.io/kivy-mobile-wheels/simple/"]
exclude = ["kivy-garden", "requests", "charset-normalizer", "idna", "urllib3", "docutils", "pygments"]

[tool.kivy.ios.python]
version = "3.15.2"

# Remote Config in-app defaults, read from the app bundle (remote_config_tests.py)
[[tool.kivy.ios.include_files]]
dest = "."
sources = ["RemoteConfigDefaults.plist"]

[tool.kivy.ios.native.swift_packages.Firebase]
url = "https://github.com/firebase/firebase-ios-sdk.git"
requirement = { from = "13.1.1" }
products = [
    "FirebaseAnalytics",
    "FirebaseAppCheck",
    "FirebaseAuth",
    "FirebaseCrashlytics",
    "FirebaseDatabase",
    "FirebaseFirestore",
    "FirebaseFunctions",
    "FirebaseInAppMessaging-Beta",
    "FirebaseMessaging",
    "FirebasePerformance",
    "FirebaseRemoteConfig",
    "FirebaseStorage",
]

# Facebook Login, for pyios_firebase.auth.facebook (the e2e app checks the
# SDK's classes and selectors; it cannot log in without a Facebook app)
[tool.kivy.ios.native.swift_packages.facebook-ios-sdk]
url = "https://github.com/facebook/facebook-ios-sdk.git"
requirement = { from = "19.0.1" }
products = ["FacebookLogin"]

# Keeps the notification tap that launches the app until Python can take it
# (pyios_firebase.messaging.notifications.set_handlers delivers it to on_open)
[tool.kivy.ios.native.swift_packages.PyiosFirebaseNotificationsHook]
url = "https://github.com/PySimpleObjC/pyios-firebase-notifications-hook.git"
requirement = { from = "0.1.0" }
products = ["PyiosFirebaseNotificationsHook"]

[tool.kivy.ios.xcode.build_settings]
OTHER_LDFLAGS = "$(inherited) -ObjC"

# Firebase Auth needs a callback URL scheme for phone and web sign-in:
# "app-" + GOOGLE_APP_ID with "-" for ":" (the app has no client ID). Without
# it the SDK stops the app; pyios-firebase reports an AuthError instead.
[[tool.kivy.ios.info_plist.CFBundleURLTypes]]
CFBundleTypeRole = "Editor"
CFBundleURLSchemes = ["app-1-1234567890-ios-0123456789abcdef"]

# Crashlytics keeps reports on the device (crashlytics_tests.py reads them with
# the unsent-report API); nothing is sent for the demo project
[tool.kivy.ios.info_plist]
FirebaseCrashlyticsCollectionEnabled = false
